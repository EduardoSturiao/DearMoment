<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presente SoulMates</title>

  <!-- Open Graph — link bonito ao compartilhar no WhatsApp/Instagram -->
  <meta property="og:title"       content="Você recebeu um presente especial ❤️">
  <meta property="og:description" content="Abra e descubra uma homenagem criada só para você.">
  <meta property="og:image"       content="./assets/images/icons8-relationship-64.png">

  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/presente.css">
  <link rel="stylesheet" href="./assets/css/cookies.css">
</head>
<body>

  <!-- Partículas de coração -->
  <div class="particles">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>

  <!-- Tela de revelação — aparece ao abrir o link/QR -->
  <div id="revealScreen">
    <div class="reveal-particles" id="revealParticles"></div>
    <div class="reveal-content">
      <div class="reveal-icon">💌</div>
      <p class="reveal-from" id="revealFrom">Alguém preparou</p>
      <h1 class="reveal-title">algo especial<br>para você ✨</h1>
      <button class="reveal-btn" id="btnReveal">Abrir presente 🎁</button>
    </div>
  </div>

  <!-- Header fixo -->
  <header class="gift-header">
    <span class="gift-logo">❤ SoulMates</span>
    <span class="gift-tag">Presente exclusivo</span>
  </header>

  <!-- Conteúdo principal — preenchido pelo JS -->
  <div id="giftRoot"></div>

  <!-- Overlay do YouTube -->
  <div class="yt-overlay" id="ytOverlay">
    <iframe id="ytFrame" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    <button class="yt-close-btn" id="btnYtClose">✕ Fechar player</button>
  </div>

  <!-- Stories fullscreen (galeria) -->
  <div class="stories-overlay" id="storiesOverlay">
    <div class="stories-bars" id="storiesBars"></div>
    <button class="stories-close" id="storiesClose">✕</button>
    <img class="stories-img" id="storiesImg" src="" alt="Foto">
    <div class="stories-tap-left"  id="storiesTapLeft"></div>
    <div class="stories-tap-right" id="storiesTapRight"></div>
    <div class="stories-counter"   id="storiesCounter"></div>
  </div>


  <script>
  /* ================================================================
     PRESENTE.HTML — Renderização da página pública do presente
  ================================================================ */

  /* ── 1. Lê o ID da URL e encontra o presente ────────── */
  const params  = new URLSearchParams(window.location.search);
  const giftId  = params.get('id');
  const gifts   = JSON.parse(localStorage.getItem('soulmates_gifts') || '[]');
  const gift    = gifts.find(g => g.id === giftId);

  const root = document.getElementById('giftRoot');
  let counterInterval = null;

  if (!gift) {
    // Erro: pula a tela de revelação direto
    document.getElementById('revealScreen').style.display = 'none';
    root.style.opacity = '1';
    root.innerHTML = `
      <div class="gift-error">
        <div class="gift-error-emoji">💔</div>
        <h2>Presente não encontrado</h2>
        <p>O link pode ter expirado ou não está disponível neste dispositivo.<br>
           Peça ao remetente para compartilhar novamente.</p>
        <a href="./index.html">Criar o meu presente →</a>
      </div>`;
    document.title = 'SoulMates';
    stopAll();
  } else {
    renderGift(gift);
    setupReveal(gift);
  }

  /* ── 2. Renderiza o presente completo ───────────────── */
  function renderGift(g) {
    // Atualiza título da aba e meta OG
    const names = g.name1 && g.name2 ? `${g.name1} & ${g.name2}` : 'Presente especial';
    document.title = names + ' | SoulMates';
    document.querySelector('meta[property="og:title"]').content =
      `${names} — Um presente feito com amor ❤️`;

    // Fotos para o stories (usa g.photos; fallback para extraPhoto)
    const storyPhotos = (g.photos && g.photos.length) ? g.photos
                      : (g.extraPhoto ? [g.extraPhoto] : []);
    const firstPhoto  = storyPhotos[0] || '';

    // Player
    const songName   = g.songName   || 'Nossa Música';
    const artistName = g.artistName || 'Artista';

    const playerHTML = `
      <div class="gift-player">
        <audio id="giftAudio" preload="none"${g.previewUrl ? ` src="${g.previewUrl}"` : ''}></audio>
        <div class="gift-player-inner">
          <div class="gift-player-thumb">
            ${firstPhoto ? `<img src="${firstPhoto}" alt="Capa">` : '🎵'}
          </div>
          <div class="gift-player-meta">
            <div class="gift-song-name">${escHtml(songName)}</div>
            <div class="gift-artist-name">${escHtml(artistName)}</div>
          </div>
          <button class="gift-play-btn" id="btnGiftPlay" title="Ouvir música">▶</button>
        </div>
        <div class="gift-player-bar" id="giftPlayerBar" style="cursor:pointer">
          <div class="gift-player-bar-fill" id="giftBarFill"></div>
        </div>
        <div class="gift-player-times">
          <span id="giftTimeNow">0:00</span>
          <span id="giftTimeTotal">—:——</span>
        </div>
      </div>`;

    // Galeria de fotos
    const galleryPhotos = g.photos || [];
    const galleryHTML = galleryPhotos.length
      ? `<section class="gift-gallery-section">
           <p class="gift-section-title">Nossas Fotos 📸 <span class="gift-section-hint">toque para ver</span></p>
           <div class="gift-gallery" id="giftGallery">
             ${galleryPhotos.map((src, i) => `
               <div class="gift-gallery-thumb" data-src="${src}" data-index="${i}">
                 <img src="${src}" alt="Foto ${i + 1}" loading="lazy">
               </div>`).join('')}
           </div>
         </section>`
      : '';

    // Mensagem
    const messageHTML = g.message
      ? `<section class="gift-message-section">
           <div class="gift-message-card">
             <p class="gift-message-text">${escHtml(g.message)}</p>
             ${g.name1 ? `<p class="gift-message-signature">Com amor, ${escHtml(g.name1)} ❤️</p>` : ''}
           </div>
         </section>`
      : '';

    // Monta o HTML completo
    root.innerHTML = `
      <div class="gift-wrap">

        <!-- Hero — stories de fotos -->
        <section class="gift-hero" id="giftHero">
          <div class="gift-hero-bars" id="giftHeroBars"></div>
          <div class="gift-cover">
            ${firstPhoto
              ? `<img src="${firstPhoto}" alt="Foto 1" id="giftHeroImg">`
              : `<div class="gift-cover-placeholder">❤️</div>`}
            <div class="gift-cover-overlay"></div>
          </div>
          ${storyPhotos.length > 1 ? `
          <button class="gift-hero-arrow prev" id="giftHeroPrev">‹</button>
          <button class="gift-hero-arrow next" id="giftHeroNext">›</button>` : ''}
          <div class="gift-hero-content">
            <h1 class="gift-names">${escHtml(names)}</h1>
            ${g.title ? `<p class="gift-title-text">${escHtml(g.title)}</p>` : ''}
          </div>
        </section>

        <!-- Player -->
        ${playerHTML}

        <!-- Contador + cidade -->
        <section class="gift-info">
          <p class="gift-info-label">Juntos há</p>
          <div class="gift-counter-grid">
            <div class="gift-counter-unit"><span id="gcYears">—</span><small>anos</small></div>
            <div class="gift-counter-unit"><span id="gcMonths">—</span><small>meses</small></div>
            <div class="gift-counter-unit"><span id="gcDays">—</span><small>dias</small></div>
            <div class="gift-counter-unit"><span id="gcHours">—</span><small>horas</small></div>
            <div class="gift-counter-unit"><span id="gcMinutes">—</span><small>min</small></div>
            <div class="gift-counter-unit"><span id="gcSeconds">—</span><small>seg</small></div>
          </div>
          ${g.startDate
            ? `<p class="gift-since">desde <strong>${formatDate(g.startDate)}</strong></p>`
            : ''}
          ${g.city
            ? `<p class="gift-city">📍 ${escHtml(g.city)}</p>`
            : ''}
        </section>

        <!-- Mensagem -->
        ${messageHTML}

        <!-- Galeria -->
        ${galleryHTML}

        <!-- Footer -->
        <footer class="gift-footer">
          <p>Criado com ❤ no SoulMates</p>
          <a href="./index.html">Criar o meu presente →</a>
        </footer>

      </div>`;

    // Inicia as interações após renderizar
    if (g.startDate) startCounter(g.startDate);
    setupPlayer(g);
    if (storyPhotos.length > 1) setupHeroStories(storyPhotos);
    if (galleryPhotos.length)   setupGallery();
  }

  /* ── 3. Contador em tempo real ──────────────────────── */
  function startCounter(dateStr) {
    function tick() {
      const t = calcTimeSince(dateStr);
      if (!t) return;
      setTxt('gcYears',   t.years);
      setTxt('gcMonths',  t.months);
      setTxt('gcDays',    t.days);
      setTxt('gcHours',   t.hours);
      setTxt('gcMinutes', t.minutes);
      setTxt('gcSeconds', t.seconds);
    }
    tick();
    counterInterval = setInterval(tick, 1000);
  }

  function calcTimeSince(dateStr) {
    const start = new Date(dateStr + 'T00:00:00');
    const now   = new Date();
    if (isNaN(start) || start > now) return null;

    let years  = now.getFullYear() - start.getFullYear();
    let months = now.getMonth()    - start.getMonth();
    let days   = now.getDate()     - start.getDate();

    if (days   < 0) { months--; days   += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
    if (months < 0) { years--;  months += 12; }

    const totalMs  = now - start;
    const hours    = Math.floor((totalMs / 3600000) % 24);
    const minutes  = Math.floor((totalMs / 60000)   % 60);
    const seconds  = Math.floor((totalMs / 1000)    % 60);

    return { years, months, days, hours, minutes, seconds };
  }

  /* ── 4. Player de música ─────────────────────────────── */
  function setupPlayer(g) {
    const btn      = document.getElementById('btnGiftPlay');
    const audioEl  = document.getElementById('giftAudio');
    const barFill  = document.getElementById('giftBarFill');
    const barTrack = document.getElementById('giftPlayerBar');
    const timeNow  = document.getElementById('giftTimeNow');
    const timeTotal = document.getElementById('giftTimeTotal');

    if (!btn || !audioEl) return;

    /* ── Áudio real (previewUrl do iTunes) ── */
    if (g.previewUrl) {
      audioEl.addEventListener('loadedmetadata', () => {
        timeTotal.textContent = fmtTime(audioEl.duration);
      });

      audioEl.addEventListener('timeupdate', () => {
        if (!audioEl.duration) return;
        const pct = (audioEl.currentTime / audioEl.duration) * 100;
        barFill.style.width = pct + '%';
        timeNow.textContent = fmtTime(audioEl.currentTime);
      });

      audioEl.addEventListener('ended', () => {
        btn.textContent = '▶';
        barFill.style.width = '0%';
        timeNow.textContent  = '0:00';
      });

      btn.addEventListener('click', () => {
        if (audioEl.paused) {
          audioEl.play().catch(() => {});
          btn.textContent = '⏸';
        } else {
          audioEl.pause();
          btn.textContent = '▶';
        }
      });

      /* Clique na barra para buscar posição */
      if (barTrack) {
        barTrack.addEventListener('click', e => {
          if (!audioEl.duration) return;
          const rect = barTrack.getBoundingClientRect();
          const pct  = (e.clientX - rect.left) / rect.width;
          audioEl.currentTime = pct * audioEl.duration;
        });
      }
      return;
    }

    /* ── Sem previewUrl: botão desativado visualmente ── */
    btn.disabled = true;
    btn.style.opacity = '0.35';
    btn.title = 'Prévia não disponível';
  }

  function fmtTime(secs) {
    if (!secs || isNaN(secs)) return '0:00';
    const m = Math.floor(secs / 60);
    const s = Math.floor(secs % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
  }

  /* ── 5. Hero Stories — navegação de fotos ───────────── */
  function setupHeroStories(photos) {
    const hero    = document.getElementById('giftHero');
    const imgEl   = document.getElementById('giftHeroImg');
    const barsEl  = document.getElementById('giftHeroBars');
    const prevBtn = document.getElementById('giftHeroPrev');
    const nextBtn = document.getElementById('giftHeroNext');

    if (!hero || !imgEl || !barsEl) return;

    const DURATION = 5000;
    let current    = 0;
    let timer      = null;
    let isPaused   = false;

    /* Reconstrói as barras; a ativa recebe a animação de progresso */
    function buildBars(active) {
      barsEl.innerHTML = photos.map((_, i) => {
        const cls = i < active ? 'done' : i === active ? 'active' : '';
        const dur = cls === 'active' ? ` style="--dur:${DURATION}ms"` : '';
        return `<div class="gift-hero-bar"><div class="gift-hero-bar-fill ${cls}"${dur}></div></div>`;
      }).join('');
    }

    /* Troca a foto com fade */
    function showPhoto(index) {
      clearTimeout(timer);
      current = index;
      imgEl.style.opacity = '0';
      setTimeout(() => {
        imgEl.src = photos[current];
        imgEl.style.opacity = '1';
      }, 150);
      buildBars(current);
      if (!isPaused) timer = setTimeout(() => advance(1), DURATION);
    }

    /* Avança (loop) ou recua */
    function advance(dir) {
      let next = current + dir;
      if (next < 0)             next = photos.length - 1;
      if (next >= photos.length) next = 0;
      showPhoto(next);
    }

    /* Inicia na primeira foto */
    buildBars(0);
    timer = setTimeout(() => advance(1), DURATION);

    /* Desktop: setas */
    if (prevBtn) prevBtn.addEventListener('click', e => { e.stopPropagation(); advance(-1); });
    if (nextBtn) nextBtn.addEventListener('click', e => { e.stopPropagation(); advance(1);  });

    /* Desktop: teclado (setas) */
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') advance(1);
      if (e.key === 'ArrowLeft')  advance(-1);
    });

    /* Mobile: swipe horizontal */
    let touchStartX = 0;
    let touchStartY = 0;
    hero.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });
    hero.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) advance(dx < 0 ? 1 : -1);
    });

    /* Pausa ao segurar (press and hold) */
    hero.addEventListener('mousedown',  () => { isPaused = true;  clearTimeout(timer); });
    hero.addEventListener('mouseup',    () => { isPaused = false; timer = setTimeout(() => advance(1), 800); });
    hero.addEventListener('touchstart', () => { isPaused = true;  clearTimeout(timer); }, { passive: true });
    hero.addEventListener('touchend',   () => { isPaused = false; timer = setTimeout(() => advance(1), 800); });
  }

  /* ── 6. Galeria — Stories fullscreen ───────────────── */
  function setupGallery() {
    const thumbs   = [...document.querySelectorAll('.gift-gallery-thumb')];
    if (!thumbs.length) return;

    const photos   = thumbs.map(t => t.dataset.src);
    const overlay  = document.getElementById('storiesOverlay');
    const barsEl   = document.getElementById('storiesBars');
    const closeBtn = document.getElementById('storiesClose');
    const imgEl    = document.getElementById('storiesImg');
    const tapLeft  = document.getElementById('storiesTapLeft');
    const tapRight = document.getElementById('storiesTapRight');
    const counter  = document.getElementById('storiesCounter');

    const DURATION = 4000;
    let current = 0;
    let timer   = null;

    function openStories(index) {
      current = index;
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
      showStory(current);
    }

    function closeStories() {
      overlay.classList.remove('open');
      document.body.style.overflow = '';
      clearTimeout(timer);
      imgEl.src = '';
    }

    function showStory(index) {
      clearTimeout(timer);
      imgEl.style.opacity = '0';
      imgEl.src = photos[index];
      imgEl.onload = () => { imgEl.style.opacity = '1'; };
      counter.textContent = `${index + 1} / ${photos.length}`;
      buildBars(index);
      timer = setTimeout(() => advance(1), DURATION);
    }

    function buildBars(active) {
      barsEl.innerHTML = photos.map((_, i) => {
        const cls = i < active ? 'done' : i === active ? 'active' : '';
        return `<div class="stories-bar"><div class="stories-bar-fill ${cls}"></div></div>`;
      }).join('');
    }

    function advance(dir) {
      const next = current + dir;
      if (next < 0 || next >= photos.length) { closeStories(); return; }
      current = next;
      showStory(current);
    }

    thumbs.forEach((thumb, i) => thumb.addEventListener('click', () => openStories(i)));
    closeBtn.addEventListener('click', closeStories);
    tapLeft.addEventListener('click',  () => advance(-1));
    tapRight.addEventListener('click', () => advance(1));

    let touchStartX = 0;
    overlay.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
    overlay.addEventListener('touchend',   e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 40) advance(dx < 0 ? 1 : -1);
    });

    document.addEventListener('keydown', e => {
      if (!overlay.classList.contains('open')) return;
      if (e.key === 'Escape')     closeStories();
      if (e.key === 'ArrowRight') advance(1);
      if (e.key === 'ArrowLeft')  advance(-1);
    });
  }

  /* ── Reveal Screen ──────────────────────────────────── */
  function setupReveal(g) {
    const screen    = document.getElementById('revealScreen');
    const fromEl    = document.getElementById('revealFrom');
    const btn       = document.getElementById('btnReveal');
    const container = document.getElementById('revealParticles');

    // Atualiza mensagem com nome de quem criou o presente
    if (g.name1) {
      fromEl.textContent = g.name1 + ' preparou';
    }

    // Gera partículas flutuantes de fundo
    const emojis = ['💕','💗','💖','💝','✨','🌸','💫','🥀','💞','🌹','💓','⭐'];
    for (let i = 0; i < 20; i++) {
      const el = document.createElement('span');
      el.className = 'reveal-particle';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left               = (Math.random() * 100) + '%';
      el.style.fontSize           = (13 + Math.random() * 18) + 'px';
      el.style.animationDuration  = (6 + Math.random() * 10) + 's';
      el.style.animationDelay     = (Math.random() * 9) + 's';
      container.appendChild(el);
    }

    btn.addEventListener('click', () => {
      // 1. Pulso no botão
      btn.classList.add('reveal-btn-clicked');

      // 2. Explosão radial de partículas
      spawnBurst();

      // 3. Exit animation na tela + flash de luz
      setTimeout(() => {
        screen.classList.add('reveal-exit');
        const flash = document.createElement('div');
        flash.className = 'reveal-flash';
        document.body.appendChild(flash);
        setTimeout(() => flash.remove(), 600);
      }, 130);

      // 4. Esconde a tela e exibe o presente com entrada suave
      setTimeout(() => {
        screen.style.display = 'none';
        root.classList.add('gift-revealed');
      }, 850);
    });
  }

  function spawnBurst() {
    const burstEmojis = ['💗','💖','💕','✨','💫','🌸','💝','⭐','💞','🥀','🌹','💓'];
    const wrap = document.createElement('div');
    wrap.className = 'reveal-burst';
    document.body.appendChild(wrap);

    const total = 22;
    for (let i = 0; i < total; i++) {
      const el   = document.createElement('span');
      el.className = 'reveal-burst-particle';
      el.textContent = burstEmojis[Math.floor(Math.random() * burstEmojis.length)];

      const angle = (i / total) * 360 + (Math.random() * 16 - 8);
      const dist  = 110 + Math.random() * 220;
      const rad   = (angle * Math.PI) / 180;
      const dx    = Math.round(Math.cos(rad) * dist);
      const dy    = Math.round(Math.sin(rad) * dist);
      const rot   = Math.round(Math.random() * 360 - 180);
      const dur   = (0.45 + Math.random() * 0.35).toFixed(2);
      const size  = Math.round(14 + Math.random() * 22);

      el.style.cssText =
        `--dx:${dx}px;--dy:${dy}px;--rot:${rot}deg;--dur:${dur}s;font-size:${size}px`;
      wrap.appendChild(el);
    }

    setTimeout(() => wrap.remove(), 900);
  }

  /* ── Utilitários ─────────────────────────────────────── */
  function setTxt(id, val) {
    const el = document.getElementById(id);
    if (el) el.textContent = val;
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function formatDate(dateStr) {
    const [y, m, d] = dateStr.split('-');
    return `${d}/${m}/${y}`;
  }

  function stopAll() {
    if (counterInterval) clearInterval(counterInterval);
    const audio = document.getElementById('giftAudio');
    if (audio) audio.pause();
  }
  </script>

  <!-- Cookie Consent Banner -->
  <div id="sm-cookie-banner" role="dialog" aria-label="Aviso de cookies">
    <span class="sm-cookie-icon">🍪</span>
    <p class="sm-cookie-text">
      <strong>Sua privacidade importa</strong>
      Usamos cookies para melhorar sua experiência. Ao continuar, você concorda com nossa política de privacidade.
    </p>
    <div class="sm-cookie-actions">
      <button id="sm-cookie-accept">Aceitar</button>
      <button id="sm-cookie-reject">Recusar</button>
    </div>
  </div>
  <script src="./assets/js/cookies.js"></script>
</body>
</html>
