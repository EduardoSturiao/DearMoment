<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presente SoulMates</title>

  <!-- Open Graph — link bonito ao compartilhar no WhatsApp/Instagram -->
  <meta property="og:title"       content="Você recebeu um presente especial ❤️">
  <meta property="og:description" content="Abra e descubra uma homenagem criada só para você.">
  <meta property="og:image"       content="./assets/images/icons8-relationship-64.png">

  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/presente.css">
  <link rel="stylesheet" href="./assets/css/cookies.css">
</head>
<body>

  <!-- Partículas de coração -->
  <div class="particles">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>

  <!-- Header fixo -->
  <header class="gift-header">
    <span class="gift-logo">❤ SoulMates</span>
    <span class="gift-tag">Presente exclusivo</span>
  </header>

  <!-- Conteúdo principal — preenchido pelo JS -->
  <div id="giftRoot"></div>

  <!-- Overlay do YouTube -->
  <div class="yt-overlay" id="ytOverlay">
    <iframe id="ytFrame" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    <button class="yt-close-btn" id="btnYtClose">✕ Fechar player</button>
  </div>

  <!-- Stories de fotos -->
  <div class="stories-overlay" id="storiesOverlay">
    <div class="stories-bars" id="storiesBars"></div>
    <button class="stories-close" id="storiesClose">✕</button>
    <img class="stories-img" id="storiesImg" src="" alt="Foto">
    <div class="stories-tap-left"  id="storiesTapLeft"></div>
    <div class="stories-tap-right" id="storiesTapRight"></div>
    <div class="stories-counter"   id="storiesCounter"></div>
  </div>

  <audio id="giftAudio" preload="metadata"></audio>

  <script>
  /* ================================================================
     PRESENTE.HTML — Renderização da página pública do presente
  ================================================================ */

  /* ── 1. Lê o ID da URL e encontra o presente ────────── */
  let counterInterval = null;
  const WIZARD_STORAGE_KEY = 'soulmates_wizard_state';
  const params  = new URLSearchParams(window.location.search);
  const giftId  = params.get('id');
  const gifts   = JSON.parse(localStorage.getItem('soulmates_gifts') || '[]');
  const lastGiftId = localStorage.getItem('soulmates_last_gift_id');
  let gift = gifts.find(g => g.id === giftId);

  const root = document.getElementById('giftRoot');

  if (!gift) {
    gift = getGiftFromWizardState(giftId, lastGiftId);
  }

  if (!gift) {
    root.innerHTML = `
      <div class="gift-error">
        <div class="gift-error-emoji">💔</div>
        <h2>Presente não encontrado</h2>
        <p>O link pode ter expirado ou não está disponível neste dispositivo.<br>
           Peça ao remetente para compartilhar novamente.</p>
        <a href="./index.html">Criar o meu presente →</a>
      </div>`;
    document.title = 'SoulMates';
    stopAll();
  } else {
    renderGift(gift);
  }

  function getGiftFromWizardState(requestedId, savedLastGiftId) {
    try {
      const raw = localStorage.getItem(WIZARD_STORAGE_KEY);
      if (!raw) return null;

      const wizard = JSON.parse(raw);
      if (!wizard) return null;

      const matchesCurrentFlow = !requestedId || requestedId === savedLastGiftId;
      const hasMinimumData = Boolean(wizard.name1 || wizard.name2 || wizard.title || wizard.message);

      if (!matchesCurrentFlow || !hasMinimumData) return null;

      return {
        id: savedLastGiftId || requestedId || 'wizard-preview',
        name1: wizard.name1 || '',
        name2: wizard.name2 || '',
        startDate: wizard.startDate || '',
        city: wizard.city || '',
        title: wizard.title || '',
        youtubeId: wizard.youtubeId || '',
        previewUrl: wizard.previewUrl || '',
        musicMoment: Math.max(0, Number(wizard.musicMoment) || 0),
        songName: wizard.songName || '',
        artistName: wizard.artistName || '',
        photos: Array.isArray(wizard.photos) ? wizard.photos.filter(Boolean) : [],
        message: wizard.message || '',
        capsulas: Array.isArray(wizard.capsulas) ? wizard.capsulas : ['', '', '', ''],
        extraPhoto: wizard.extraPhoto || '',
        giftType: wizard.giftType || 'amoroso',
        selectedTemplate: wizard.selectedTemplate || 'spotify',
        createdAt: wizard.createdAt || new Date().toISOString(),
      };
    } catch (_) {
      return null;
    }
  }

  /* ── 2. Renderiza o presente completo ───────────────── */
  function renderGift(g) {
    // Atualiza título da aba e meta OG
    const names = g.name1 && g.name2 ? `${g.name1} & ${g.name2}` : 'Presente especial';
    document.title = names + ' | SoulMates';
    document.querySelector('meta[property="og:title"]').content =
      `${names} — Um presente feito com amor ❤️`;

    // Foto de capa
    const coverSrc = g.extraPhoto || (g.photos && g.photos[0]) || '';
    const heroHTML = coverSrc
      ? `<img src="${coverSrc}" alt="Foto de capa" />`
      : `<div class="gift-cover-placeholder">❤️</div>`;

    // Galeria (exclui foto de capa para não duplicar)
    const galleryPhotos = g.photos || [];
    const galleryHTML = galleryPhotos.length
      ? `<section class="gift-gallery-section">
           <p class="gift-section-title">Nossas Fotos 📸 <span class="gift-section-hint">toque para ver</span></p>
           <div class="gift-gallery" id="giftGallery">
             ${galleryPhotos.map((src, i) => `
               <div class="gift-gallery-thumb" data-src="${src}" data-index="${i}">
                 <img src="${src}" alt="Foto ${i + 1}" loading="lazy">
               </div>`).join('')}
           </div>
         </section>`
      : '';

    // Player
    const songName   = g.songName   || 'Nossa Música';
    const artistName = g.artistName || 'Artista';
    const thumbSrc   = coverSrc;

    const playerHTML = `
      <div class="gift-player">
        <div class="gift-player-inner">
          <div class="gift-player-thumb">
            ${thumbSrc
              ? `<img src="${thumbSrc}" alt="Capa">`
              : '🎵'}
          </div>
          <div class="gift-player-meta">
            <div class="gift-song-name">${escHtml(songName)}</div>
            <div class="gift-artist-name">${escHtml(artistName)}</div>
          </div>
          <button class="gift-play-btn" id="btnGiftPlay" title="Ouvir música">▶</button>
        </div>
        <div class="gift-player-bar">
          <div class="gift-player-bar-fill" id="giftPlayerBarFill"></div>
        </div>
        <div class="gift-player-times">
          <span id="giftPlayerCurrent">0:00</span>
          <span id="giftPlayerDuration">—:——</span>
        </div>
      </div>`;

    // Cápsulas + Carta
    const capsulaEmojis  = ['💌', '🎵', '📍', '🔮'];
    const capsulaTextos  = (g.capsulas && g.capsulas.length)
      ? g.capsulas
      : ['', '', '', ''];
    const capsulasTitles = ['O primeiro dia', 'Nossa música', 'Nosso lugar', 'O que vem aí'];

    const capsulaItems = capsulaEmojis.map((emoji, i) => `
      <div class="gc-capsula" data-index="${i}">
        <div class="gc-capsula-inner">
          <div class="gc-capsula-frente">
            <div class="gc-capsula-flap"></div>
            <div class="gc-capsula-seal">${emoji}</div>
            <div class="gc-capsula-num">Cápsula 0${i + 1}</div>
            <div class="gc-capsula-hint">Toque para abrir</div>
          </div>
          <div class="gc-capsula-verso">
            <div class="gc-verso-emoji">${emoji}</div>
            <div class="gc-verso-titulo">${escHtml(capsulasTitles[i])}</div>
            <div class="gc-verso-texto">${escHtml(capsulaTextos[i] || capsulasTitles[i])}</div>
          </div>
        </div>
      </div>`).join('');

    const capsulaHTML = `
      <div class="gc-hero">
        <div class="gc-hero-glow"></div>
        <div class="gc-hero-badge">✦ SoulMates · Presente Especial</div>
        <h1 class="gc-hero-title">Guardei<br>tudo isso<br>para você</h1>
        <p class="gc-hero-sub">Abra cada cápsula com calma.<br>Cada uma guarda um pedaço do que sinto.</p>
        <div class="gc-hero-divider"><span></span><em>💌</em><span></span></div>
      </div>
      <div class="gc-progress-wrap">
        <div class="gc-progress-label">
          <span>Cápsulas abertas</span>
          <span id="gcProgressText">0 / 4</span>
        </div>
        <div class="gc-progress-track"><div class="gc-progress-fill" id="gcProgressFill"></div></div>
      </div>
      <div class="gc-capsulas-grid" id="gcCapsulaGrid">
        ${capsulaItems}
      </div>
      <div class="gc-btn-carta-wrap" id="gcBtnCartaWrap">
        <p class="gc-btn-carta-hint">Você abriu tudo. Tem uma última coisa...</p>
        <button class="gc-btn-carta" id="gcBtnCarta">
          <span class="gc-btn-icon">✉️</span>
          Ler a carta completa
        </button>
      </div>`;

    const cartaHTML = g.message ? `
      <section class="gc-carta-section" id="gcCartaSection">
        <div class="gc-carta-ornamento"><span></span><em>💌</em><span></span></div>
        <div class="gc-carta-papel">
          <div class="gc-carta-data">${new Date().toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' })}</div>
          <div class="gc-carta-linha"></div>
          <div class="gc-carta-saudacao">${g.name2 ? escHtml(g.name2) + ',' : 'Amor,'}</div>
          <div class="gc-carta-corpo" id="gcCartaCorpo"><span class="gc-cursor" id="gcCursor"></span></div>
          <div class="gc-carta-assinatura" id="gcCartaAssinatura">
            <span class="gc-assina-com">com todo o meu amor,</span>
            <span class="gc-assina-nome">${g.name1 ? escHtml(g.name1) : 'Eu'}</span>
            <span class="gc-assina-emoji">❤️</span>
          </div>
          <div class="gc-carta-selos" id="gcCartaSelos">
            <div class="gc-selo"><span>💕</span>Para sempre</div>
            <div class="gc-selo"><span>✨</span>Com amor</div>
            <div class="gc-selo"><span>🔒</span>Só para você</div>
          </div>
        </div>
      </section>` : '';

    // Monta o HTML completo — duas telas
    root.innerHTML = `

      <!-- ── TELA 1: O presente ── -->
      <div class="gift-screen" id="giftScreenMain">
        <div class="gift-wrap">

          <!-- Hero -->
          <section class="gift-hero">
            <div class="gift-cover">
              ${heroHTML}
              <div class="gift-cover-overlay"></div>
            </div>
            <div class="gift-hero-content">
              <h1 class="gift-names">${escHtml(names)}</h1>
              ${g.title ? `<p class="gift-title-text">${escHtml(g.title)}</p>` : ''}
            </div>
          </section>

          <!-- Player -->
          ${playerHTML}

          <!-- Contador + cidade -->
          <section class="gift-info">
            <p class="gift-info-label">Juntos há</p>
            <div class="gift-counter-grid">
              <div class="gift-counter-unit"><span id="gcYears">—</span><small>anos</small></div>
              <div class="gift-counter-unit"><span id="gcMonths">—</span><small>meses</small></div>
              <div class="gift-counter-unit"><span id="gcDays">—</span><small>dias</small></div>
              <div class="gift-counter-unit"><span id="gcHours">—</span><small>horas</small></div>
              <div class="gift-counter-unit"><span id="gcMinutes">—</span><small>min</small></div>
              <div class="gift-counter-unit"><span id="gcSeconds">—</span><small>seg</small></div>
            </div>
            ${g.startDate ? `<p class="gift-since">desde <strong>${formatDate(g.startDate)}</strong></p>` : ''}
            ${g.city     ? `<p class="gift-city">📍 ${escHtml(g.city)}</p>` : ''}
          </section>

          <!-- Galeria -->
          ${galleryHTML}

          <!-- Botão de transição para tela 2 -->
          ${(capsulaHTML || cartaHTML) ? `
          <div class="gift-next-wrap">
            <p class="gift-next-hint">Ainda tem mais para você...</p>
            <button class="gift-next-btn" id="btnGoCapsulas">
              <span class="gift-next-icon">💌</span>
              Tem algo guardado para você
            </button>
          </div>` : ''}

          <!-- Footer -->
          <footer class="gift-footer">
            <p>Criado com ❤ no SoulMates</p>
            <a href="./index.html">Criar o meu presente →</a>
          </footer>

        </div>
      </div>

      <!-- ── TELA 2: Cápsulas + Carta ── -->
      <div class="gift-screen gift-screen--hidden" id="giftScreenCapsulas">
        <canvas class="gc-star-canvas" id="gcStarCanvas"></canvas>
        <div class="gc-bg-particles" id="gcBgParticles"></div>
        <div class="gc-burst-wrap" id="gcBurstWrap"></div>
        <div class="gc-page-wrap">
          ${capsulaHTML}
          ${cartaHTML}
          <footer class="gift-footer" style="margin-top:48px;position:relative;z-index:1">
            <p>Criado com ❤ no SoulMates</p>
            <a href="./index.html">Criar o meu presente →</a>
          </footer>
        </div>
      </div>`;

    // Inicia as interações após renderizar
    if (g.startDate) startCounter(g.startDate);
    setupPlayer(g);
    setupCapsulasCarta(g);
    setupGallery();
  }

  /* ── 3. Contador em tempo real ──────────────────────── */
  function startCounter(dateStr) {
    function tick() {
      const t = calcTimeSince(dateStr);
      if (!t) return;
      setTxt('gcYears',   t.years);
      setTxt('gcMonths',  t.months);
      setTxt('gcDays',    t.days);
      setTxt('gcHours',   t.hours);
      setTxt('gcMinutes', t.minutes);
      setTxt('gcSeconds', t.seconds);
    }
    tick();
    counterInterval = setInterval(tick, 1000);
  }

  function calcTimeSince(dateStr) {
    const start = new Date(dateStr + 'T00:00:00');
    const now   = new Date();
    if (isNaN(start) || start > now) return null;

    let years  = now.getFullYear() - start.getFullYear();
    let months = now.getMonth()    - start.getMonth();
    let days   = now.getDate()     - start.getDate();

    if (days   < 0) { months--; days   += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
    if (months < 0) { years--;  months += 12; }

    const totalMs  = now - start;
    const hours    = Math.floor((totalMs / 3600000) % 24);
    const minutes  = Math.floor((totalMs / 60000)   % 60);
    const seconds  = Math.floor((totalMs / 1000)    % 60);

    return { years, months, days, hours, minutes, seconds };
  }

  /* ── 4. Player de música (YouTube overlay) ──────────── */
  function setupPlayer(gift) {
    const btn     = document.getElementById('btnGiftPlay');
    const overlay = document.getElementById('ytOverlay');
    const frame   = document.getElementById('ytFrame');
    const closeBtn = document.getElementById('btnYtClose');
    const audio = document.getElementById('giftAudio');
    const barFill = document.getElementById('giftPlayerBarFill');
    const currentLabel = document.getElementById('giftPlayerCurrent');
    const durationLabel = document.getElementById('giftPlayerDuration');
    const previewUrl = gift.previewUrl || '';
    const youtubeId = gift.youtubeId || '';
    const desiredStart = Math.max(0, Number(gift.musicMoment) || 0);

    if (!btn) return;

    function formatAudioTime(totalSeconds) {
      const safeSeconds = Math.max(0, Number(totalSeconds) || 0);
      const minutes = Math.floor(safeSeconds / 60);
      const seconds = Math.floor(safeSeconds % 60).toString().padStart(2, '0');
      return `${minutes}:${seconds}`;
    }

    function getPreviewStart() {
      const duration = Number(audio.duration);
      if (Number.isFinite(duration) && duration > 0) {
        if (desiredStart > duration) return 0;
        return Math.min(desiredStart, Math.max(0, duration - 0.35));
      }
      return desiredStart;
    }

    function syncAudioUi() {
      if (!audio || !barFill || !currentLabel || !durationLabel) return;

      const current = Number(audio.currentTime) || 0;
      const duration = Number(audio.duration) || 0;
      currentLabel.textContent = formatAudioTime(current);
      durationLabel.textContent = duration > 0 ? formatAudioTime(duration) : '—:——';
      barFill.style.width = duration > 0 ? `${Math.min((current / duration) * 100, 100)}%` : '0%';
      btn.textContent = audio.paused ? '▶' : '❚❚';
    }

    function closeYoutubeOverlay() {
      overlay.classList.remove('open');
      frame.src = '';
    }

    if (previewUrl && audio) {
      audio.src = previewUrl;

      audio.addEventListener('loadedmetadata', () => {
        try {
          audio.currentTime = getPreviewStart();
        } catch (_) { /* no-op */ }
        syncAudioUi();
      });

      audio.addEventListener('timeupdate', syncAudioUi);
      audio.addEventListener('play', syncAudioUi);
      audio.addEventListener('pause', syncAudioUi);
      audio.addEventListener('ended', () => {
        try {
          audio.currentTime = getPreviewStart();
        } catch (_) { /* no-op */ }
        syncAudioUi();
      });

      btn.addEventListener('click', () => {
        if (overlay.classList.contains('open')) closeYoutubeOverlay();

        if (audio.paused) {
          if (audio.currentTime <= 0.05) {
            try {
              audio.currentTime = getPreviewStart();
            } catch (_) { /* no-op */ }
          }
          audio.play().catch(() => {});
        } else {
          audio.pause();
        }
      });

      syncAudioUi();
      return;
    }

    if (!youtubeId) {
      btn.disabled = true;
      btn.textContent = '—';
      return;
    }

    btn.addEventListener('click', () => {
      frame.src = `https://www.youtube-nocookie.com/embed/${youtubeId}?autoplay=1&rel=0`;
      overlay.classList.add('open');
    });

    closeBtn.addEventListener('click', () => {
      closeYoutubeOverlay();
    });

    overlay.addEventListener('click', e => {
      if (e.target === overlay) {
        closeYoutubeOverlay();
      }
    });
  }

  /* ── 5. Cápsulas + Carta ────────────────────────────── */
  function setupCapsulasCarta(g) {
    /* ── Transição tela 1 → tela 2 ── */
    const btnGo     = document.getElementById('btnGoCapsulas');
    const screen1   = document.getElementById('giftScreenMain');
    const screen2   = document.getElementById('giftScreenCapsulas');

    if (btnGo && screen1 && screen2) {
      btnGo.addEventListener('click', () => {
        screen1.classList.add('gift-screen--exit');
        setTimeout(() => {
          screen1.style.display = 'none';
          screen2.classList.remove('gift-screen--hidden');
          screen2.classList.add('gift-screen--enter');
          window.scrollTo({ top: 0, behavior: 'instant' });
          initGcStarfield();
          initGcParticles();
        }, 420);
      });
    }

    const capsulas    = document.querySelectorAll('.gc-capsula');
    const progressFill = document.getElementById('gcProgressFill');
    const progressText = document.getElementById('gcProgressText');
    const btnWrap     = document.getElementById('gcBtnCartaWrap');
    const btnCarta    = document.getElementById('gcBtnCarta');
    const cartaSection = document.getElementById('gcCartaSection');
    if (!capsulas.length) return;

    let abertas = 0;
    const total = capsulas.length;

    /* Aparece as cápsulas com delay escalonado */
    capsulas.forEach((c, i) => {
      setTimeout(() => c.classList.add('gc-visible'), 300 + i * 120);
    });

    /* Abre cápsula ao clicar */
    capsulas.forEach(c => {
      c.addEventListener('click', () => {
        if (c.classList.contains('gc-aberta')) return;
        c.classList.add('gc-aberta');
        abertas++;
        spawnBurstCapsulas(c);
        const pct = (abertas / total) * 100;
        if (progressFill) progressFill.style.width = pct + '%';
        if (progressText) progressText.textContent = `${abertas} / ${total}`;
        if (abertas === total && btnWrap) {
          setTimeout(() => btnWrap.classList.add('gc-visivel'), 500);
        }
      });
    });

    /* Burst de partículas ao abrir */
    function spawnBurstCapsulas(el) {
      const rect   = el.getBoundingClientRect();
      const cx     = rect.left + rect.width / 2;
      const cy     = rect.top  + rect.height / 2;
      const emojis = ['💗','💖','✨','💫','🌸','💕','⭐','💝'];
      const wrap   = document.getElementById('gcBurstWrap');
      if (!wrap) return;
      const n = 16;
      for (let i = 0; i < n; i++) {
        const p     = document.createElement('div');
        p.className = 'gc-burst-p';
        const angle = (i / n) * 360 + Math.random() * 20;
        const dist  = 80 + Math.random() * 140;
        const rad   = angle * Math.PI / 180;
        const tx    = Math.cos(rad) * dist;
        const ty    = Math.sin(rad) * dist;
        const rot   = Math.round(Math.random() * 360 - 180);
        const dur   = (0.5 + Math.random() * 0.4).toFixed(2);
        p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        p.style.cssText = `left:${cx}px;top:${cy}px;font-size:${12+Math.random()*12}px;--tx:${tx}px;--ty:${ty}px;--r:${rot}deg;--d:${dur}s`;
        wrap.appendChild(p);
        setTimeout(() => p.remove(), parseFloat(dur) * 1000 + 50);
      }
    }

    /* Ver carta */
    if (btnCarta && cartaSection) {
      btnCarta.addEventListener('click', () => {
        if (btnWrap) btnWrap.style.display = 'none';
        cartaSection.classList.add('gc-carta-visivel');
        requestAnimationFrame(() => requestAnimationFrame(() => {
          cartaSection.classList.add('gc-carta-animada');
          setTimeout(() => {
            cartaSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            setTimeout(() => digitarCarta(g.message), 700);
          }, 100);
        }));
      });
    }

    /* Máquina de escrever */
    function digitarCarta(texto) {
      if (!texto) return;
      const corpo    = document.getElementById('gcCartaCorpo');
      const cursor   = document.getElementById('gcCursor');
      const assinatura = document.getElementById('gcCartaAssinatura');
      const selos    = document.getElementById('gcCartaSelos');
      if (!corpo || !cursor) return;

      corpo.innerHTML = '';
      corpo.appendChild(cursor);
      let i = 0;

      function tick() {
        if (i >= texto.length) {
          cursor.classList.add('gc-cursor-oculto');
          if (assinatura) assinatura.classList.add('gc-visivel');
          if (selos) selos.classList.add('gc-visivel');
          return;
        }
        const ch = texto[i++];
        if (ch === '\n') {
          cursor.insertAdjacentHTML('beforebegin', '<br><br>');
        } else {
          cursor.insertAdjacentText('beforebegin', ch);
        }
        const delay = '.!?'.includes(ch) ? 110 : ch === ',' ? 70 : (Math.random() < 0.04 ? 55 : 26);
        setTimeout(tick, delay);
      }
      tick();
    }

    function initGcStarfield() {
      const canvas = document.getElementById('gcStarCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let stars = [], W, H;
      function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
      function createStars(n) {
        stars = [];
        for (let i = 0; i < n; i++) stars.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.4+0.2, alpha: Math.random(), speed: Math.random()*0.004+0.001, phase: Math.random()*Math.PI*2 });
      }
      function draw(t) {
        ctx.clearRect(0, 0, W, H);
        stars.forEach(s => {
          s.alpha = 0.25 + 0.65 * Math.abs(Math.sin(s.phase + t * s.speed));
          ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
          ctx.fillStyle = `rgba(255,255,255,${s.alpha.toFixed(2)})`; ctx.fill();
        });
        requestAnimationFrame(draw);
      }
      resize(); createStars(160);
      window.addEventListener('resize', () => { resize(); createStars(160); });
      requestAnimationFrame(draw);
    }

    function initGcParticles() {
      const wrap = document.getElementById('gcBgParticles');
      if (!wrap) return;
      const emojis = ['💕','💗','✨','🌸','💫','⭐','🥀','💞'];
      for (let i = 0; i < 14; i++) {
        const el = document.createElement('div');
        el.className = 'gc-bg-particle';
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = Math.random() * 100 + '%';
        el.style.fontSize = (10 + Math.random() * 12) + 'px';
        el.style.animationDuration = (18 + Math.random() * 20) + 's';
        el.style.animationDelay = -(Math.random() * 20) + 's';
        wrap.appendChild(el);
      }
    }
  }

  /* ── 6. Galeria — Stories viewer ────────────────────── */
  function setupGallery() {
    const thumbs   = [...document.querySelectorAll('.gift-gallery-thumb')];
    if (!thumbs.length) return;

    const photos   = thumbs.map(t => t.dataset.src);
    const overlay  = document.getElementById('storiesOverlay');
    const barsEl   = document.getElementById('storiesBars');
    const closeBtn = document.getElementById('storiesClose');
    const imgEl    = document.getElementById('storiesImg');
    const tapLeft  = document.getElementById('storiesTapLeft');
    const tapRight = document.getElementById('storiesTapRight');
    const counter  = document.getElementById('storiesCounter');

    const DURATION = 4000;
    let current = 0;
    let timer   = null;

    /* Abre o stories no índice clicado */
    function openStories(index) {
      current = index;
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
      showStory(current);
    }

    /* Fecha e limpa tudo */
    function closeStories() {
      overlay.classList.remove('open');
      document.body.style.overflow = '';
      clearTimeout(timer);
      imgEl.src = '';
    }

    /* Exibe uma foto e reinicia o progresso */
    function showStory(index) {
      clearTimeout(timer);
      imgEl.style.opacity = '0';
      imgEl.src = photos[index];
      imgEl.onload = () => { imgEl.style.opacity = '1'; };
      counter.textContent = `${index + 1} / ${photos.length}`;
      buildBars(index);
      timer = setTimeout(() => advance(1), DURATION);
    }

    /* Constrói as barras de progresso */
    function buildBars(active) {
      barsEl.innerHTML = photos.map((_, i) => {
        const cls = i < active ? 'done' : i === active ? 'active' : '';
        return `<div class="stories-bar"><div class="stories-bar-fill ${cls}"></div></div>`;
      }).join('');
    }

    /* Avança ou recua; fecha ao sair dos extremos */
    function advance(dir) {
      const next = current + dir;
      if (next < 0 || next >= photos.length) { closeStories(); return; }
      current = next;
      showStory(current);
    }

    /* Abre ao clicar num thumbnail */
    thumbs.forEach((thumb, i) => thumb.addEventListener('click', () => openStories(i)));

    closeBtn.addEventListener('click', closeStories);
    tapLeft.addEventListener('click',  () => advance(-1));
    tapRight.addEventListener('click', () => advance(1));

    /* Swipe mobile */
    let touchStartX = 0;
    overlay.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
    overlay.addEventListener('touchend',   e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 40) advance(dx < 0 ? 1 : -1);
    });

    /* Fechar com Escape no desktop */
    document.addEventListener('keydown', e => {
      if (!overlay.classList.contains('open')) return;
      if (e.key === 'Escape')      closeStories();
      if (e.key === 'ArrowRight')  advance(1);
      if (e.key === 'ArrowLeft')   advance(-1);
    });
  }

  /* ── Utilitários ─────────────────────────────────────── */
  function setTxt(id, val) {
    const el = document.getElementById(id);
    if (el) el.textContent = val;
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function formatDate(dateStr) {
    const [y, m, d] = dateStr.split('-');
    return `${d}/${m}/${y}`;
  }

  function stopAll() {
    if (counterInterval) clearInterval(counterInterval);
    const audio = document.getElementById('giftAudio');
    if (audio) audio.pause();
  }
  </script>
