<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./assets/css/login.css">
    <link rel="stylesheet" href="./assets/css/cookies.css">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&display=swap" rel="stylesheet">
    <title>Login | SoulMates</title>
</head>
<body>
     <main id="form_container">

        <!-- Logo -->
        <a href="./index.html" style="display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;margin-bottom:28px;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 3 34 23" width="38" height="26" style="filter:drop-shadow(0 0 6px rgba(255,109,186,0.45));">
            <defs>
              <clipPath id="sm-clip-top"><rect x="0" y="3" width="34" height="11"/></clipPath>
              <clipPath id="sm-clip-bot"><rect x="0" y="14" width="34" height="13"/></clipPath>
            </defs>
            <circle cx="22" cy="14" r="9" stroke="#ffb6d9" stroke-width="3.2" fill="none" clip-path="url(#sm-clip-bot)"/>
            <circle cx="12" cy="14" r="9" stroke="#ff6dba" stroke-width="3.2" fill="none"/>
            <circle cx="22" cy="14" r="9" stroke="#ffb6d9" stroke-width="3.2" fill="none" clip-path="url(#sm-clip-top)"/>
          </svg>
          <span style="font-family:'Syne',sans-serif;font-weight:700;font-size:20px;color:#ff6dba;letter-spacing:0.5px;">SoulMates</span>
        </a>

        <div id="form_header">
            <h1 id="form_title">
                Fazer Login
            </h1>
            <a style="font-size: 13px" class="btn-default" href="./cadastro.html">
                <i class="fa-solid fa-right-to-bracket"></i>
                Cadastro
            </a>
        </div>

        <form action="" id="form">
            <div id="input_container">
                <div class="input-box">
                    <label for="name" class="form-label">
                        E-mail
                    </label>
                    <div class="input-field">
                        <input type="text" name="name" id="name" class="form-control" placeholder="E-mail">
                        <i class="fa-regular fa-user"></i>
                    </div>
                    <span class="error"></span>
                </div>

                <div class="input-box">
                    <label for="password" class="form-label">
                        Senha
                    </label>
                    <div class="input-field">
                        <input type="password" name="password" id="password" class="form-control" placeholder="*******">
                        <i class="fa-regular fa-eye-slash password-icon"></i>
                    </div>
                    <span class="error"></span>
                </div>

               
            </div>

            <button type="sumbit" class="btn-default">
                <i class="fa-solid fa-check"></i>
                Entrar
            </button>
        </form>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="./assets/js/supabase-client.js"></script>
    <script src="./assets/js/login.js"></script>

    <!-- Cookie Consent Banner -->
    <div id="sm-cookie-banner" role="dialog" aria-label="Aviso de cookies">
      <span class="sm-cookie-icon">🍪</span>
      <p class="sm-cookie-text">
        <strong>Sua privacidade importa</strong>
        Usamos cookies para melhorar sua experiência. Ao continuar, você concorda com nossa política de privacidade.
      </p>
      <div class="sm-cookie-actions">
        <button id="sm-cookie-accept">Aceitar</button>
        <button id="sm-cookie-reject">Recusar</button>
      </div>
    </div>
    <script src="./assets/js/cookies.js"></script>
</body>
</html>
